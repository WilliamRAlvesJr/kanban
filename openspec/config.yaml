schema: spec-driven

context: |
  Projeto: kanban (com.william:kanban), aplicação Spring Boot para gestão de quadros kanban.

  Stack, comandos, convenções de código e estado do projeto estão no CLAUDE.md, na raiz do
  repositório. Leia esse arquivo antes de gerar qualquer artefato; o que segue aqui vale só
  para a escrita dos artefatos.

  Escrita dos artefatos (vale para proposal, design, tasks e specs):
  - O artefato descreve exatamente o que vai ser implementado nesta change, e nada mais.
  - Não registre justificativa de decisão, alternativa descartada nem comparação de abordagens. Única exceção: no design, a decisão tomada vem com a consequência dela para quem implementa, em uma ou duas frases, nunca o caminho até a decisão.
  - Não mencione trabalho futuro, ideia adiada, próximos passos nem o que "vira spec própria". Se algo fica de fora, liste só o nome, em uma linha, sem explicação.
  - Não descreva o estado anterior do projeto, o que existia antes nem o que foi removido.
  - Sem hedge: nada de "talvez", "poderia", "provavelmente", "por enquanto". Toda frase afirma um comportamento definido.
  - Cada fato aparece em um lugar só, dentro do artefato e entre artefatos. O design e o tasks não repetem o que a proposal já diz: apontam para ela.

  Diagramas:
  - Prefira diagrama Mermaid a texto sempre que o conteúdo for fluxo, sequência de chamadas, máquina de estados, modelo de dados ou relação entre componentes.
  - O diagrama substitui a prosa que o descreveria, não convive com ela. Depois do diagrama, escreva só o que ele não mostra.
  - Use o tipo certo: flowchart para fluxo e decisão, sequenceDiagram para troca entre camadas ou serviços, erDiagram para tabelas e relações, stateDiagram-v2 para estados, classDiagram para estrutura de tipos.
  - Um diagrama por ideia, com no máximo cerca de 12 nós. Se passar disso, divida em dois.
  - Rótulos em português, curtos, com o nome real do endpoint, tabela, classe ou coluna.
  - Todo bloco fica entre ```mermaid e ```.

rules:
  proposal:
    - 'Why: no máximo três frases, só o problema que motiva a change. Sem contexto histórico e sem antecipar a solução.'
    - 'What Changes: bullets, um comportamento observável por bullet, frase direta. Sem parágrafo de abertura e sem repetir o que já está em outro bullet.'
    - 'Impact: só fatos verificáveis (pacotes, endpoints, dependências, arquivos de configuração, migrations). Nenhuma linha de racional.'
    - 'Em What Changes, use um diagrama Mermaid no lugar do texto sempre que a change tiver fluxo de requisição, mudança de estado ou tabela nova. Os bullets ficam só com o que o diagrama não expressa (códigos de status, regras de validação, formato de campo).'
  specs:
    - 'O corpo de cada cenário é um bloco cercado ```gherkin logo abaixo do header `#### Scenario: <nome>`. Nunca bullets `- **WHEN**` / `- **THEN**`.'
    - 'O header `#### Scenario:` fica fora do bloco: openspec validate só conta header que não está dentro de fence, e cenário dentro do fence não existe para a validação nem para o archive.'
    - 'Dentro do bloco vai só a sequência de passos, um por linha, com as palavras-chave Gherkin em inglês: Given, When, Then, And, But.'
    - 'O bloco não repete Feature nem Scenario: o nome do cenário já está no header markdown.'
    - 'Um When por cenário. Pré-condição em Given, resultado observável em Then, passo do mesmo tipo em And.'
    - 'Passo é frase curta em português, com o nome real do endpoint, campo, coluna ou código de status. Valor literal entre aspas duplas.'
    - 'Scenario Outline com Examples só quando o mesmo passo se repete para três ou mais valores; a tabela fica dentro do mesmo bloco.'
    - |
      Formato:

      #### Scenario: Conta criada
      ```gherkin
      Given nenhuma conta com o email "ana@exemplo.com"
      When chega POST /accounts com email "Ana@Exemplo.com", display_name e password
      Then a resposta é 201 com id, email e display_name
      And o header Location aponta para /accounts/{id}
      ```
  tasks:
    - 'Uma task pode trazer um bloco ```diff logo abaixo do checkbox, com a forma concreta da mudança.'
    - 'A cerca abre e fecha na coluna 0, separada do checkbox por uma linha em branco: cerca indentada não recebe realce de sintaxe.'
    - 'O bloco é opcional: use quando a forma do código não se deduz da descrição. Task de rodar comando, ajustar documentação ou escrever teste já descrito fica só com o texto.'
    - 'O checkbox continua carregando a descrição e a verificação; o diff não substitui o texto nem repete o que ele diz.'
    - 'Primeira linha do bloco: `+++ b/<caminho relativo do arquivo>`.'
    - 'O código dentro do diff mantém a indentação real do arquivo, uma tag ou instrução por linha. Nada de elemento colapsado em linha única para poupar espaço.'
    - 'O diff traz só as linhas que importam: assinatura, anotação, propriedade, coluna, dependência. Corpo de método, import e bloco inalterado saem, marcados com `...`. Nunca cole arquivo inteiro.'
  design:
    - 'Toda decisão de estrutura vem com um diagrama Mermaid: componentes e suas chamadas, sequência do caso principal, modelo de dados. O texto ao lado só acrescenta o que o desenho não carrega.'
    - 'Nada de diagrama decorativo: se o desenho não muda o entendimento de quem vai implementar, corte.'
