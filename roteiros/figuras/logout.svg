<svg viewBox="0 0 560 300" role="img" aria-label="O token deixa o cabecalho e passa pelas credenciais da autenticacao" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><g class="passo" data-passo="0"><rect x="24" y="40" width="240" height="76" rx="5"/><text x="144" y="66" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">controlador lia o cabecalho</text><text x="144" y="85" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">a documentacao declarava</text><text x="144" y="102" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">um parametro Authorization</text><line x1="264" y1="78" x2="318" y2="78"/><polygon points="318,78 310,73.5 310,82.5" fill="currentColor" stroke="none"/><rect x="318" y="48" width="218" height="60" rx="5"/><text x="427" y="72" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">campo extra na interface</text><text x="427" y="90" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">de testes, preenchido a mao</text></g><g class="passo" data-passo="1"><rect x="24" y="150" width="150" height="60" rx="5"/><text x="99" y="174" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">filtro</text><text x="99" y="192" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">guarda o token</text><line x1="174" y1="180" x2="222" y2="180"/><polygon points="222,180 214,175.5 214,184.5" fill="currentColor" stroke="none"/><rect x="222" y="150" width="150" height="60" rx="5"/><text x="297" y="174" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">credentials</text><text x="297" y="192" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">do Authentication</text><line x1="372" y1="180" x2="420" y2="180"/><polygon points="420,180 412,175.5 412,184.5" fill="currentColor" stroke="none"/><rect x="420" y="150" width="116" height="60" rx="5"/><text x="478" y="174" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">logout</text><text x="478" y="192" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">revoga a linha</text></g><g class="passo" data-passo="2"><rect x="140" y="234" width="280" height="42" rx="5" stroke-dasharray="4 3"/><text x="280" y="260" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">teste: a operacao nao declara parametro</text></g></svg>
