<svg viewBox="0 0 560 300" role="img" aria-label="Tres defeitos encontrados rodando a aplicacao e a suite" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><g class="passo" data-passo="0"><rect x="24" y="34" width="236" height="68" rx="5"/><text x="142" y="60" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">usuario gerado na subida</text><text x="142" y="79" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">desligar basica e formulario</text><text x="142" y="95" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">nao bastou</text><line x1="260" y1="68" x2="314" y2="68"/><polygon points="314,68 306,63.5 306,72.5" fill="currentColor" stroke="none"/><rect x="314" y="42" width="222" height="52" rx="5"/><text x="425" y="66" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">excluir a autoconfiguracao</text><text x="425" y="84" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">na classe principal</text></g><g class="passo" data-passo="1"><rect x="24" y="118" width="236" height="68" rx="5"/><text x="142" y="144" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">dois formatos de 401</text><text x="142" y="163" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">o do filtro nao trazia</text><text x="142" y="179" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">o campo instance</text><line x1="260" y1="152" x2="314" y2="152"/><polygon points="314,152 306,147.5 306,156.5" fill="currentColor" stroke="none"/><rect x="314" y="126" width="222" height="52" rx="5"/><text x="425" y="150" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">o ponto de entrada preenche</text><text x="425" y="168" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">o endereco da requisicao</text></g><g class="passo" data-passo="2"><rect x="24" y="202" width="236" height="68" rx="5"/><text x="142" y="228" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">uma conta so no teste</text><text x="142" y="247" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">devolver sempre a primeira</text><text x="142" y="263" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">linha passaria verde</text><line x1="260" y1="236" x2="314" y2="236"/><polygon points="314,236 306,231.5 306,240.5" fill="currentColor" stroke="none"/><rect x="314" y="210" width="222" height="52" rx="5"/><text x="425" y="234" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">duas contas, dois tokens</text><text x="425" y="252" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">a resposta e a do segundo</text></g></svg>
