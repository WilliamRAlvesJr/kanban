<svg viewBox="0 0 560 300" role="img" aria-label="O token sorteado vai em claro para a resposta e como resumo para o banco" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><g class="passo" data-passo="0"><rect x="24" y="120" width="132" height="60" rx="5"/><text x="90" y="145" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">SecureRandom</text><text x="90" y="164" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">32 bytes</text><line x1="156" y1="150" x2="206" y2="150"/><polygon points="206,150 198,145.5 198,154.5" fill="currentColor" stroke="none"/><text x="181" y="141" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">base64</text></g><rect x="206" y="126" width="132" height="48" rx="5"/><text x="272" y="147" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">token em claro</text><text x="272" y="164" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">url-safe, sem padding</text><g class="passo" data-passo="1"><line x1="272" y1="174" x2="272" y2="216"/><polygon points="272,216 267.5,208 276.5,208" fill="currentColor" stroke="none"/><text x="286" y="198" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">sha-256</text><rect x="188" y="220" width="168" height="46" rx="5"/><text x="272" y="240" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">token_hash no banco</text><text x="272" y="257" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">so o resumo, em hexadecimal</text></g><g class="passo" data-passo="2"><line x1="338" y1="150" x2="392" y2="150"/><polygon points="392,150 384,145.5 384,154.5" fill="currentColor" stroke="none"/><rect x="392" y="100" width="144" height="100" rx="5"/><text x="464" y="126" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">IssuedToken</text><line x1="392" y1="138" x2="536" y2="138"/><text x="464" y="158" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">value</text><text x="464" y="180" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">expiresAt</text><text x="464" y="222" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">unica resposta com o</text><text x="464" y="238" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">valor em claro</text></g></svg>
