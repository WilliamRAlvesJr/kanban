<svg viewBox="0 0 560 300" role="img" aria-label="A consulta por id sai, entra a conta do token e o cadastro perde o Location" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><g class="passo" data-passo="0"><rect x="24" y="48" width="228" height="62" rx="5"/><text x="138" y="74" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">conta por identificador</text><text x="138" y="93" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">qualquer conta, qualquer chamador</text><line x1="40" y1="104" x2="236" y2="54"/></g><g class="passo" data-passo="1"><line x1="252" y1="79" x2="306" y2="79"/><polygon points="306,79 298,74.5 298,83.5" fill="currentColor" stroke="none"/><rect x="306" y="42" width="230" height="74" rx="5"/><text x="421" y="68" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">conta do token</text><text x="421" y="87" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">id vem do principal da requisicao</text><text x="421" y="105" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">o controlador nao le o cabecalho</text></g><g class="passo" data-passo="2"><rect x="24" y="176" width="228" height="70" rx="5"/><text x="138" y="203" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none">cadastro de conta</text><text x="138" y="222" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">201 com id, email e display_name</text><text x="138" y="239" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">sem cabecalho Location</text><line x1="252" y1="211" x2="306" y2="211"/><polygon points="306,211 298,206.5 298,215.5" fill="currentColor" stroke="none"/><rect x="306" y="182" width="230" height="58" rx="5"/><text x="421" y="206" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">o Location apontava para o</text><text x="421" y="224" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none" opacity=".72">endpoint que saiu</text></g></svg>
