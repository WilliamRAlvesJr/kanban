<svg viewBox="0 0 560 300" role="img" aria-label="A requisicao passa pelo filtro, autentica ou cai no ponto de entrada" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="24" y="128" width="112" height="46" rx="5"/><text x="80" y="156" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">requisicao</text><g class="passo" data-passo="0"><line x1="136" y1="151" x2="188" y2="151"/><polygon points="188,151 180,146.5 180,155.5" fill="currentColor" stroke="none"/><rect x="188" y="122" width="144" height="58" rx="5"/><text x="260" y="145" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">BearerAuthentication</text><text x="260" y="161" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">Filter</text><text x="260" y="176" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">le o cabecalho, resolve</text><line x1="332" y1="138" x2="392" y2="104"/><polygon points="392,104 383.2,106.9 387.7,114.7" fill="currentColor" stroke="none"/><text x="366" y="112" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">vale</text><rect x="392" y="72" width="144" height="52" rx="5"/><text x="464" y="94" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">contexto com o id</text><text x="464" y="112" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity=".72">chega ao controlador</text></g><g class="passo" data-passo="1"><line x1="332" y1="166" x2="392" y2="202"/><polygon points="392,202 387.9,193.5 383.3,201.1" fill="currentColor" stroke="none"/><text x="360" y="198" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none" opacity=".72">nao vale</text><rect x="392" y="180" width="144" height="52" rx="5"/><text x="464" y="202" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">401 em ProblemDetail</text><text x="464" y="220" text-anchor="middle" font-siz